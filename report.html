<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<title>แจ้งของหาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Poppins:wght@800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="chingtun.css">

</head>


<body>


<header>
<div class="brand-logo" aria-hidden="true">
<svg viewBox="0 0 220 105" width="176" height="84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KhongHai">
  <text x="2" y="54" font-family="'Poppins','Segoe UI',sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    <tspan style="fill:var(--text)">Khong</tspan><tspan style="fill:var(--accent)">Hai</tspan>
  </text>
  <rect x="2" y="68" width="204" height="27" rx="13.5" style="fill:var(--surface-2); stroke:var(--border); stroke-width:1"/>
  <text x="104" y="86" text-anchor="middle" font-family="'Sarabun',sans-serif" font-weight="700" font-size="10" letter-spacing="1.4" style="fill:var(--text-muted)">LOST &amp; FOUND SYSTEM</text>
</svg>
</div>
<h1 class="sr-only">KhongHai — แจ้งของหาย</h1>
<p class="page-tag">แจ้งของหาย</p>
<button id="themeBtn">โหมดสว่าง</button>
</header>


<nav>
<a href="index.html">หน้าแรก</a>
<a href="lost.html">ของหาย</a>
<a href="report.html">แจ้งของหาย</a>
<a href="found.html">ของที่พบแล้ว</a>
<a href="contact.html">ติดต่อเรา</a>
<a href="login.html">เข้าสู่ระบบ</a>
<a href="profile.html">โปรไฟล์ของฉัน</a>
</nav>


<div class="container">

<div class="card bar" id="userBar" style="display:none;">
    <p id="userStatus" style="margin:0;"></p>
    <button id="userLogoutBtn" class="btn-danger" style="margin:0;">ออกจากระบบ</button>
</div>

<section class="card" id="reportSection" style="display:none;">
    <h2>แจ้งของหาย</h2>

    <form id="lostForm">

        <label>ชื่อผู้แจ้ง</label>
        <input type="text" id="reporterName" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น" required>

        <label>ชื่อสิ่งของ</label>
        <input type="text" id="item" placeholder="เช่น กระเป๋า โทรศัพท์" required>

        <!-- เพิ่มช่องอัปโหลดรูปภาพตรงนี้ -->
        <label>รูปภาพสิ่งของ (ถ้ามี)</label>
        <input type="file" id="image" accept="image/*">

        <label>รายละเอียด</label>
        <textarea id="detail" rows="4" placeholder="สี ลักษณะ จุดสังเกต" required></textarea>

        <label>สถานที่หาย</label>
        <input type="text" id="place" placeholder="เช่น อาคาร A" required>

        <label>ช่องทางติดต่อ</label>
        <input type="text" id="contact" placeholder="เบอร์โทร หรือ Email" required>

        <button type="submit" id="submitBtn">ส่งประกาศ</button>

    </form>
</section>

</div>


<footer>
© 2026 Lost & Found &nbsp;|&nbsp; <a href="admin-login.html">สำหรับเจ้าหน้าที่</a>
</footer>

<script type="module" src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
